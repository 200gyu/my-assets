<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0E131A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="robots" content="noindex" />
  <title>MY ASSETS · 개인 자산관리</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <link rel="stylesheet" href="css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
  <script src="js/config.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="boot" class="boot"><div class="logo-mark">MA</div></div>

  <!-- login (Supabase mode) -->
  <section id="auth" class="auth hidden">
    <div class="auth-card">
      <div class="brand"><span class="logo-mark">MA</span><div><b>MY ASSETS</b><small>개인 자산관리</small></div></div>
      <form id="auth-form">
        <label>이메일<input name="email" type="email" autocomplete="email" required /></label>
        <label>비밀번호<input name="password" type="password" autocomplete="current-password" minlength="6" required /></label>
        <button class="btn primary" type="submit">로그인</button>
        <button class="btn ghost" type="button" id="auth-signup">처음이면 계정 만들기</button>
        <p id="auth-msg" class="muted small"></p>
      </form>
    </div>
  </section>

  <div id="app" class="app hidden">
    <aside class="side">
      <div class="brand"><span class="logo-mark">MA</span><div><b>MY ASSETS</b><small id="mode-label">개인 자산관리</small></div></div>
      <nav id="nav-side"></nav>
    </aside>
    <div class="main-wrap">
      <header class="top">
        <div>
          <h1 id="view-title">홈</h1>
          <p id="view-sub" class="muted small"></p>
        </div>
        <div class="top-actions">
          <span id="demo-badge" class="badge hidden">데모 데이터</span>
          <button class="btn primary sm" id="quick-add" aria-label="거래 추가">＋ 기록</button>
        </div>
      </header>
      <main id="view"></main>
    </div>
    <nav id="nav-bottom" class="bottom-nav"></nav>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="sheet">
      <div class="sheet-head"><h2 id="modal-title"></h2><button class="icon-btn" id="modal-close" aria-label="닫기">✕</button></div>
      <div id="modal-body"></div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>
</body>
</html>
